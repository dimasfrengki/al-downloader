<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Pencarian</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔎</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg"></div>
<main>
  <header class="top">
    <div class="brand"><span class="logo">🔎</span><div><b>Pencarian</b><small>Lagu, video, gambar, aplikasi</small></div></div>
    <nav class="seg"><a href="/">Download</a><a class="on" href="/search.html">Cari</a><a href="/tourl.html">ToURL</a><a href="/hd.html">HD</a></nav>
  </header>
  <section class="panel">
    <div class="scroll" id="plat"></div>
    <label for="q">Kata kunci</label>
    <input id="q" type="search" autocomplete="off">
    <button class="go" id="go">Cari</button>
  </section>
  <section id="out" aria-live="polite"></section>
</main>
<div id="toast" role="status"></div>
<script src="/app.js"></script>
<script>
const SEARCH=[
 ['google','Google','Teknologi AI terbaru'],['wikipedia','Wikipedia','Indonesia'],['gimage','Gambar','kucing anggora'],['wallpaper','Wallpaper','Cyberpunk City'],
 ['pinterest','Pinterest Foto','anime wallpaper'],['pinterestvid','Pinterest Video','anime wallpaper'],['tiktok','TikTok','jedag jedug'],['spotify','Spotify','steve lacy'],
 ['lirik','Lirik','Tulus Hati Hati di Jalan'],['chord','Chord','Payung Teduh Akad'],['playstore','Play Store','Mobile Legends'],['gsmarena','Spek HP','iPhone 15 Pro'],
 ['komik','Komik','Solo Leveling'],['otakudesu','Anime','naruto'],['bstation','Bstation','naruto'],['sfile','Sfile','whatsapp'],['resep','Resep','Nasi Goreng Spesial']
];
const GRID=['gimage','wallpaper','pinterest'];
let cur='google';const q=$('q'),go=$('go');
$('plat').innerHTML=SEARCH.map(e=>`<button class="pc" type="button" data-ep="${e[0]}">${e[1]}</button>`).join('');
function pick(ep){cur=ep;q.placeholder=SEARCH.find(x=>x[0]===ep)[2];document.querySelectorAll('.pc').forEach(b=>b.classList.toggle('on',b.dataset.ep===ep))}
$('plat').onclick=e=>{const b=e.target.closest('.pc');if(b)pick(b.dataset.ep)};
q.addEventListener('keydown',e=>{if(e.key==='Enter')go.click()});
go.onclick=async()=>{
  const val=q.value.trim();
  if(!val){$('out').innerHTML='<div class="msg">Isi kata kunci dulu.</div>';return}
  $('out').className=GRID.includes(cur)?'grid':'';
  go.disabled=true;go.textContent='Mencari...';loading();
  try{show(await api('search',cur,val),'search')}
  catch(e){$('out').innerHTML=`<div class="msg">${esc(e.message)}</div>`}
  go.disabled=false;go.textContent='Cari';
};
pick('google');
applyConfig('search',pick);
</script>
</body>
</html>
