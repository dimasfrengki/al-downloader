<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pencarian</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔎</text></svg>">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#141a2e;--mut:#65708c;--line:#dde3f0;--acc:#4f46e5;--ok:#0f9d6b;--err:#d23a4a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c30;--ink:#eef0fa;--mut:#96a0bf;--line:#2a3050;--acc:#7c74ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px 16px 60px}
main{max-width:560px;margin:0 auto}
h1{font-size:1.6rem;margin:8px 0 4px}
p.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 6px}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
select:focus,input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.go{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.go:disabled{opacity:.6}
#out{margin-top:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs a{text-align:center;text-decoration:none;flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.tabs a.on{background:var(--acc);border-color:var(--acc);color:#fff}
.item .t{font-weight:600}.item .f{color:var(--mut);font-size:.88rem;margin-top:2px;white-space:pre-wrap}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--card);word-break:break-word}
.item img{max-width:100%;border-radius:8px;display:block;margin-bottom:8px}
.item video,.item audio{width:100%;margin-bottom:8px}
.item b{display:block;margin-bottom:4px}
.item a.btn{display:inline-block;margin:6px 6px 0 0;padding:8px 14px;background:var(--acc);color:#fff;border-radius:8px;text-decoration:none;font-size:.9rem}
.msg{color:var(--err);margin-top:12px}
details{margin-top:12px;color:var(--mut);font-size:.85rem}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:10px;border-radius:8px;max-height:260px;overflow:auto}
</style>
</head>
<body>
<main>
  <nav class="tabs"><a href="/" class="">Download</a><a href="/search.html" class="on">Cari</a></nav>
  <h1>Pencarian</h1>
  <p class="sub">Cari lagu, gambar, aplikasi, dan lainnya.</p>
  <div class="card">
    <label for="ep">Cari di</label>
    <select id="ep"></select>
    <label for="q">Kata kunci</label>
    <input id="q" type="text" autocomplete="off">
    <button class="go" id="go">Cari</button>
  </div>
  <div id="out" aria-live="polite"></div>
</main>
<script>
const SEARCH=[
 ['google','Google','Teknologi AI terbaru'],
 ['wikipedia','Wikipedia Indonesia','Indonesia'],
 ['gimage','Google Gambar','kucing anggora'],
 ['wallpaper','Wallpaper HD','Cyberpunk City'],
 ['pinterest','Pinterest Foto','anime wallpaper'],
 ['pinterestvid','Pinterest Video','anime wallpaper'],
 ['tiktok','TikTok','jedag jedug'],
 ['spotify','Spotify','steve lacy'],
 ['lirik','Lirik lagu','Tulus Hati Hati di Jalan'],
 ['chord','Chord gitar','Payung Teduh Akad'],
 ['playstore','Play Store','Mobile Legends'],
 ['gsmarena','GSMArena (spek HP)','iPhone 15 Pro'],
 ['komik','Komik & Manga','Solo Leveling'],
 ['otakudesu','Otakudesu (anime)','naruto'],
 ['bstation','Bstation','naruto'],
 ['sfile','Sfile.mobi','whatsapp'],
 ['resep','Resep masakan','Nasi Goreng Spesial']
];
const $=id=>document.getElementById(id);
const ep=$("ep"),q=$("q"),out=$("out"),go=$("go");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isUrl=s=>typeof s==='string'&&/^https?:\/\//.test(s);
const isImg=u=>/\.(jpe?g|png|webp|gif)(\?|$)/i.test(u);
const isVid=u=>/\.(mp4|webm|mov)(\?|$)/i.test(u);
const isAud=u=>/\.(mp3|m4a|ogg|wav)(\?|$)/i.test(u);

// kumpulkan semua URL dari JSON apa pun bentuknya
function collect(o,path='',acc=[]){
  if(isUrl(o)){acc.push({k:path,u:o})}
  else if(Array.isArray(o)){o.forEach((v,i)=>collect(v,path+'['+i+']',acc))}
  else if(o&&typeof o==='object'){for(const k in o)collect(o[k],k,acc)}
  return acc;
}
function firstText(o,keys){for(const k of keys){if(o&&typeof o[k]==='string')return o[k]}return ''}
function findList(o){
  if(Array.isArray(o))return o;
  if(o&&typeof o==='object'){for(const k in o){const v=o[k];if(Array.isArray(v)&&v.length)return v}
    for(const k in o){const r=o[k]&&typeof o[k]==='object'?findList(o[k]):null;if(r)return r}}
  return null;
}
function card(it){
  if(typeof it!=='object'||it===null)return `<div class="item">${esc(it)}</div>`;
  const ls=collect(it);
  const img=ls.find(l=>isImg(l.u)||/thumb|cover|image|img|photo|poster|url$/i.test(l.k)&&/(jpe?g|png|webp|image|img|photo)/i.test(l.u));
  const title=firstText(it,['title','name','judul','nama','query']);
  let f='';
  for(const k in it){const v=it[k];if(typeof v==='string'&&!isUrl(v)&&v!==title&&v.trim())f+=`<div class="f"><b style="display:inline">${esc(k)}:</b> ${esc(v.length>600?v.slice(0,600)+'…':v)}</div>`;else if(typeof v==='number')f+=`<div class="f">${esc(k)}: ${v}</div>`}
  const btns=ls.filter(l=>!img||l.u!==img.u).slice(0,4).map(l=>`<a class="btn" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.k.split('.').pop()||'Buka')}</a>`).join('');
  return `<div class="item">${img?`<img src="${esc(img.u)}" loading="lazy" alt="">`:''}${title?`<div class="t">${esc(title)}</div>`:''}${f}${btns}</div>`;
}
function card(it){
  if(typeof it!=='object'||it===null)return `<div class="item">${esc(it)}</div>`;
  const ls=collect(it);
  const img=ls.find(l=>isImg(l.u)||/thumb|cover|image|img|photo|poster|url$/i.test(l.k)&&/(jpe?g|png|webp|image|img|photo)/i.test(l.u));
  const title=firstText(it,['title','name','judul','nama','query']);
  let f='';
  for(const k in it){const v=it[k];if(typeof v==='string'&&!isUrl(v)&&v!==title&&v.trim())f+=`<div class="f"><b style="display:inline">${esc(k)}:</b> ${esc(v.length>600?v.slice(0,600)+'…':v)}</div>`;else if(typeof v==='number')f+=`<div class="f">${esc(k)}: ${v}</div>`}
  const btns=ls.filter(l=>!img||l.u!==img.u).slice(0,4).map(l=>`<a class="btn" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.k.split('.').pop()||'Buka')}</a>`).join('');
  return `<div class="item">${img?`<img src="${esc(img.u)}" loading="lazy" alt="">`:''}${title?`<div class="t">${esc(title)}</div>`:''}${f}${btns}</div>`;
}
function renderSearch(data){
  const root=data.result!==undefined?data.result:data.data!==undefined?data.data:data;
  const arr=findList(root);
  let html='';
  if(arr&&arr.length)html=arr.slice(0,30).map(card).join('');
  else if(typeof root==='string')html=`<div class="item"><div class="f">${esc(root)}</div></div>`;
  else html=card(root);
  html+=`<details><summary>Data mentah</summary><pre>${esc(JSON.stringify(data,null,2))}</pre></details>`;
  out.innerHTML=html;
}

ep.innerHTML=SEARCH.map(e=>`<option value="${e[0]}">${e[1]}</option>`).join('');
function sync(){q.placeholder=SEARCH.find(x=>x[0]===ep.value)[2]}
ep.onchange=sync;sync();
q.addEventListener('keydown',e=>{if(e.key==='Enter')go.click()});
go.onclick=async()=>{
  const val=q.value.trim();
  if(!val){out.innerHTML='<div class="msg">Isi kata kunci dulu.</div>';return}
  go.disabled=true;go.textContent='Mencari...';out.innerHTML='';
  try{
    const r=await fetch(`/api/dl?kind=search&ep=${encodeURIComponent(ep.value)}&q=${encodeURIComponent(val)}`);
    const t=await r.text();
    let d;try{d=JSON.parse(t)}catch{d={raw:t}}
    if(!r.ok||d.error||d.status===false)throw new Error(d.error||d.message||('Error '+r.status));
    renderSearch(d);
  }catch(e){out.innerHTML=`<div class="msg">${esc(e.message)}</div>`}
  go.disabled=false;go.textContent='Cari';
};
</script>
</body>
</html>
