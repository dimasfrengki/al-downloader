<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>All Downloader</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⬇️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg"></div>
<main>
  <header class="top">
    <div class="brand"><span class="logo">⬇</span><div><b>All Downloader</b><small>Satu tempat, semua platform</small></div></div>
    <nav class="seg"><a class="on" href="/">Download</a><a href="/search.html">Cari</a><a href="/tourl.html">ToURL</a><a href="/hd.html">HD</a></nav>
  </header>
  <section class="panel">
    <div class="scroll" id="plat" role="tablist"></div>
    <label for="q" id="ql">Link</label>
    <div class="row"><input id="q" type="text" inputmode="url" autocomplete="off" placeholder="https://..."><button class="ghost" id="paste" type="button">Tempel</button></div>
    <div id="tw" hidden><label for="type">Format</label><select id="type"><option value="mp3">MP3 (audio)</option><option value="mp4">MP4 (video)</option></select></div>
    <button class="go" id="go">Download</button>
  </section>
  <section id="out" aria-live="polite"></section>
</main>
<div id="toast" role="status"></div>
<script src="/app.js"></script>
<script>
const EPS=[
 ['tiktok','TikTok','https://vt.tiktok.com/...'],['instagram','Instagram','https://www.instagram.com/reel/...'],['youtube','YouTube','https://www.youtube.com/watch?v=...'],
 ['facebook','Facebook','https://www.facebook.com/reel/...'],['fb-reel','FB Reels','https://www.facebook.com/reel/...'],['twitter','Twitter / X','https://x.com/user/status/123'],
 ['threads','Threads','https://www.threads.net/@user/post/...'],['pinterest','Pinterest','https://pin.it/...'],['capcut','CapCut','https://www.capcut.com/template-detail/...'],
 ['snackvideo','SnackVideo','https://s.snackvideo.com/p/...'],['dailymotion','Dailymotion','https://www.dailymotion.com/video/...'],['bstation','Bstation','https://www.bilibili.tv/id/video/...'],
 ['videy','Videy','https://videy.co/v?id=...'],['shopeevid','Shopee Video','https://sv.shopee.co.id/...'],
 ['spotify','Spotify','https://open.spotify.com/track/...'],['spotify2','Spotify V2','https://open.spotify.com/track/...'],['soundcloud','SoundCloud','https://soundcloud.com/artist/track'],
 ['ytdl-mp3','YT MP3 v2','https://www.youtube.com/watch?v=...'],['ytdl-mp4','YT MP4 v2','https://www.youtube.com/watch?v=...'],
 ['mediafire','Mediafire','https://www.mediafire.com/file/...'],['gdrive','Google Drive','https://drive.google.com/file/d/...'],['terabox','TeraBox','https://terabox.com/s/...'],
 ['gofile','GoFile','https://gofile.io/d/...'],['krakenfiles','KrakenFiles','https://krakenfiles.com/view/...'],['pixeldrain','Pixeldrain','https://pixeldrain.com/u/...'],
 ['sfile','Sfile','https://sfile.mobi/...'],['github','GitHub','https://github.com/user/repo'],['apkcombo','APKCombo','Mobile Legends'],['apkpure','APKPure','WhatsApp']
];
const DETECT=[[/tiktok\.com/,'tiktok'],[/instagram\.com/,'instagram'],[/youtu\.?be/,'youtube'],[/fb\.watch|facebook\.com\/reel/,'fb-reel'],[/facebook\.com/,'facebook'],[/twitter\.com|x\.com/,'twitter'],[/threads\.(net|com)/,'threads'],[/pin\.it|pinterest\./,'pinterest'],[/capcut\.com/,'capcut'],[/snackvideo/,'snackvideo'],[/dailymotion/,'dailymotion'],[/bilibili|b23\.tv/,'bstation'],[/videy\./,'videy'],[/shopee/,'shopeevid'],[/spotify\.com/,'spotify'],[/soundcloud/,'soundcloud'],[/mediafire/,'mediafire'],[/drive\.google/,'gdrive'],[/terabox|1024tera/,'terabox'],[/gofile/,'gofile'],[/krakenfiles/,'krakenfiles'],[/pixeldrain/,'pixeldrain'],[/sfile\.mobi/,'sfile'],[/github\.com/,'github']];
let cur='tiktok';
const q=$('q'),go=$('go');
$('plat').innerHTML=EPS.map(e=>`<button class="pc" type="button" data-ep="${e[0]}">${e[1]}</button>`).join('');
function pick(ep){cur=ep;const e=EPS.find(x=>x[0]===ep);q.placeholder=e[2];$('tw').hidden=ep!=='youtube';$('ql').textContent=/^apk/.test(ep)?'Nama aplikasi':'Link '+e[1];document.querySelectorAll('.pc').forEach(b=>b.classList.toggle('on',b.dataset.ep===ep))}
$('plat').onclick=e=>{const b=e.target.closest('.pc');if(b)pick(b.dataset.ep)};
q.addEventListener('input',()=>{const m=DETECT.find(d=>d[0].test(q.value));if(m&&m[1]!==cur){pick(m[1]);document.querySelector('.pc.on')?.scrollIntoView({inline:'center',block:'nearest'})}});
$('paste').onclick=async()=>{try{q.value=await navigator.clipboard.readText();q.dispatchEvent(new Event('input'))}catch{toast('Izin clipboard ditolak, tempel manual')}};
q.addEventListener('keydown',e=>{if(e.key==='Enter')go.click()});
go.onclick=async()=>{
  const val=q.value.trim();
  if(!val){$('out').innerHTML='<div class="msg">Isi link atau nama aplikasi dulu.</div>';return}
  go.disabled=true;go.textContent='Memproses...';loading();
  try{show(await api('dl',cur,val,cur==='youtube'?'&type='+$('type').value:''),'dl')}
  catch(e){$('out').innerHTML=`<div class="msg">${esc(e.message)}</div>`}
  go.disabled=false;go.textContent='Download';
};
pick('tiktok');
applyConfig('dl',pick);
</script>
</body>
</html>
